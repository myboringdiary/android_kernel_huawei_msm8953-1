name: 编译内核+打包模块
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
      options: --user root
    defaults:
      run:
        shell: bash -euxo pipefail {0}
    steps:
      - name: 安装编译依赖
        run: |
          apt-get update
          apt-get install -y git ccache automake flex lzop bison gperf build-essential \
            zip curl zlib1g-dev bc kmod cpio libssl-dev device-tree-compiler python2 python3 xz-utils
          ln -sf /usr/bin/python2 /usr/bin/python

      - name: 检出代码
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: 拉取编译工具链
        run: |
          for i in 1 2 3; do
            rm -rf gcc gcc.tmp || true
            if git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
              -b android-8.1.0_r52 --depth=1 gcc.tmp; then
              mv gcc.tmp gcc
              break
            fi
            echo "第 ${i} 次克隆失败，等待 5 秒"
            sleep 5
          done
          ls gcc/bin/aarch64-linux-android-gcc >/dev/null 2>&1 || { echo "交叉编译器缺失"; exit 1; }
          gcc/bin/aarch64-linux-android-gcc --version || true

      - name: 修复缺失的 wireguard Kconfig 引用
        run: |
          if [ -f net/Kconfig ]; then
            sed -i 's|source "net/wireguard/Kconfig"|# source "net/wireguard/Kconfig"|' net/Kconfig
          fi

      - name: 创建缺失的 rndis_ipa_trace.h
        run: |
          mkdir -p drivers/net/ethernet/msm
          printf '%s\n' \
          '/* SPDX-License-Identifier: GPL-2.0 */' \
          '#undef TRACE_SYSTEM' \
          '#define TRACE_SYSTEM rndis_ipa' \
          '' \
          '#if !defined(_TRACE_RNDIS_IPA_H) || defined(TRACE_HEADER_MULTI_READ)' \
          '#define _TRACE_RNDIS_IPA_H' \
          '' \
          '#include <linux/tracepoint.h>' \
          '' \
          'TRACE_EVENT(rndis_tx_dp,' \
          '    TP_PROTO(int proto),' \
          '    TP_ARGS(proto),' \
          '    TP_STRUCT__entry(' \
          '        __field(int, proto)' \
          '    ),' \
          '    TP_fast_assign(' \
          '        __entry->proto = proto;' \
          '    ),' \
          '    TP_printk("proto=%d", __entry->proto)' \
          ');' \
          '' \
          'TRACE_EVENT(rndis_status_rcvd,' \
          '    TP_PROTO(int proto),' \
          '    TP_ARGS(proto),' \
          '    TP_STRUCT__entry(' \
          '        __field(int, proto)' \
          '    ),' \
          '    TP_fast_assign(' \
          '        __entry->proto = proto;' \
          '    ),' \
          '    TP_printk("proto=%d", __entry->proto)' \
          ');' \
          '' \
          'TRACE_EVENT(rndis_netif_ni,' \
          '    TP_PROTO(int proto),' \
          '    TP_ARGS(proto),' \
          '    TP_STRUCT__entry(' \
          '        __field(int, proto)' \
          '    ),' \
          '    TP_fast_assign(' \
          '        __entry->proto = proto;' \
          '    ),' \
          '    TP_printk("proto=%d", __entry->proto)' \
          ');' \
          '' \
          '#endif /* _TRACE_RNDIS_IPA_H */' \
          '' \
          '#undef TRACE_INCLUDE_FILE' \
          '#define TRACE_INCLUDE_FILE rndis_ipa_trace' \
          '#undef TRACE_INCLUDE_PATH' \
          '#define TRACE_INCLUDE_PATH ../../drivers/net/ethernet/msm' \
          '#include <trace/define_trace.h>' \
          > drivers/net/ethernet/msm/rndis_ipa_trace.h

      - name: 批量修复 trace 头文件路径
        run: |
          find drivers -name "*_trace.h" -type f | while read -r file; do
            dir=$(dirname "$file")
            newpath="../../$dir"
            if grep -q '^#define TRACE_INCLUDE_PATH' "$file"; then
              sed -i "s|^#define TRACE_INCLUDE_PATH .*|#define TRACE_INCLUDE_PATH $newpath|" "$file"
            fi
          done

      - name: 修复 mdss Makefile
        run: |
          MAKEFILE=$(find drivers/video -path "*/mdss/Makefile" | head -n1)
          if [ -n "$MAKEFILE" ]; then
            cp "$MAKEFILE" "$MAKEFILE.bak"
            sed -i '/mdss_dba_utils\.o/ s/^obj-y/obj-$(CONFIG_MSM_DBA)/' "$MAKEFILE"
          fi

      - name: 注入 DWC3 pmic_id_irq dts 补丁
        run: |
          TARGETS=$(find arch -name 'huawei-usb.dtsi' -path '*huawei_msm8953_can_l0[12]_v*' 2>/dev/null)
          if [ -z "$TARGETS" ]; then
            echo "错误：找不到 huawei-usb.dtsi"
            find arch -name 'huawei-usb.dtsi' 2>/dev/null | head -20
            exit 1
          fi
          echo "命中文件:"
          echo "$TARGETS"

          for f in $TARGETS; do
            python3 - "$f" << 'PYEOF'
import sys
fname = sys.argv[1]
with open(fname) as f:
    lines = f.readlines()
out = []
for ln in lines:
    if 'NetHunter: 接入 PMIC ID' in ln:
        break
    out.append(ln)
else:
    out = lines
if out and not out[-1].endswith('\n'):
    out[-1] = out[-1] + '\n'
patch = '''/* ===== NetHunter: 接入 PMIC ID 中断，恢复 OTG 检测 ===== */
&usb3 {
    /delete-property/ interrupts;
    interrupts-extended = <&intc 0 136 0>,
                          <&intc 0 220 0>,
                          <&intc 0 134 0>,
                          <&spmi_bus 0x2 0x11 0x3>;
    interrupt-names = "hs_phy_irq", "ss_phy_irq", "pwr_event_irq",
                      "pmic_id_irq";
    dwc3@7000000 {
        dr_mode = "otg";
    };
};
'''
out.append(patch)
with open(fname, 'w') as f:
    f.writelines(out)
print(f"已修正: {fname}")
PYEOF
          done

          echo "===== dts 校验 ====="
          for f in $TARGETS; do
            grep -q 'interrupts-extended' "$f" || { echo "错误: $f 缺少 interrupts-extended"; exit 1; }
            grep -q 'dr_mode = "otg"' "$f" || { echo "错误: $f 缺少 dr_mode"; exit 1; }
          done
          echo "dts 校验通过"

      - name: 设置 swap
        run: |
          MEM_MB=$(($(grep MemTotal /proc/meminfo | awk '{print $2}')/1024))
          echo "内存: ${MEM_MB} MB"
          if [ "$MEM_MB" -lt 12000 ]; then
            fallocate -l 8G /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=8192
            chmod 600 /swapfile
            mkswap /swapfile || true
            swapon /swapfile 2>/dev/null || echo "swap 启用失败，继续"
          fi

      - name: 编译内核和模块（生成 Image.gz-dtb）
        run: |
          export ARCH=arm64
          export PATH="$(pwd)/gcc/bin:$PATH"
          export CROSS_COMPILE="$(pwd)/gcc/bin/aarch64-linux-android-"
          make hwcan_defconfig

          # CFG80211 内建
          scripts/config --file .config --enable CFG80211
          scripts/config --file .config --enable CFG80211_INTERNAL_REGDB
          make olddefconfig

          # USB WiFi 驱动
          for sym in MAC80211 MAC80211_LEDS MAC80211_MESH \
                     ATH9K_HTC ATH9K_HTC_DEBUGFS \
                     RTL8187 RTL8192CU RTLWIFI RTLWIFI_USB \
                     RT2X00 RT2800USB RT2800USB_RT33XX RT2800USB_RT35XX \
                     RT2800USB_RT3573 RT2800USB_RT53XX RT2800USB_RT55XX RT2800USB_UNKNOWN \
                     R8188EU; do
            scripts/config --file .config --enable "$sym" 2>/dev/null || true
          done
          make olddefconfig

          # 冲突配置循环禁用
          PATTERN='MSM_DBA|HUAWEI_FACTORY_INFO|SERIAL_NUM|PN547'
          for attempt in 1 2 3 4 5; do
            SYMS=$(grep -E "^CONFIG_.*(${PATTERN})" .config | grep -E '=(y|m)$' | cut -d'=' -f1 | sort -u || true)
            if [ -z "$SYMS" ]; then break; fi
            for sym in $SYMS; do
              scripts/config --file .config --disable "${sym#CONFIG_}" 2>/dev/null || true
            done
            make olddefconfig
          done

          # configfs 依赖
          scripts/config --file .config --disable USB_G_ANDROID 2>/dev/null || true
          echo "CONFIG_CONFIGFS_FS=y" >> .config
          echo "CONFIG_USB_GADGET=y" >> .config
          echo "CONFIG_USB_CONFIGFS=y" >> .config
          echo "CONFIG_USB_CONFIGFS_F_FS=y" >> .config
          echo "CONFIG_USB_CONFIGFS_F_MTP=y" >> .config
          echo "CONFIG_USB_CONFIGFS_F_PTP=y" >> .config
          make olddefconfig

          # ★★★ 关键：先禁 USB_CI13XXX_MSM（断开它对 USB_MSM_OTG 的 select）
          for sym in USB_CI13XXX_MSM QPNP_TYPEC HUAWEI_TYPEC DUAL_ROLE_USB_INTF EXTCON EXTCON_GPIO; do
            scripts/config --file .config --disable "$sym" 2>/dev/null || true
            sed -i "s/^CONFIG_${sym}=y/# CONFIG_${sym} is not set/" .config
            sed -i "s/^CONFIG_${sym}=m/# CONFIG_${sym} is not set/" .config
          done
          make olddefconfig

          # ============================================================
          # ★★★ 六道防线：彻底断掉 select 链与 silentoldconfig 翻回
          # ============================================================
          KILL_SYMS="USB_MSM_OTG USB_MSM_HSPHY USB_CI13XXX_MSM QPNP_TYPEC HUAWEI_TYPEC DUAL_ROLE_USB_INTF EXTCON EXTCON_GPIO USB_G_ANDROID"

          # ---- 第 1 道：olddefconfig 之后再硬改 ----
          echo "===== 第 1 道：sed .config 断开表层 ====="
          for sym in $KILL_SYMS; do
            sed -i "s/^CONFIG_${sym}=y/# CONFIG_${sym} is not set/" .config
            sed -i "s/^CONFIG_${sym}=m/# CONFIG_${sym} is not set/" .config
          done

          # ---- 第 2 道：主动 silentoldconfig 暴露隐藏 select ----
          echo "===== 第 2 道：主动触发 silentoldconfig ====="
          make silentoldconfig 2>&1 | tail -60 || true

          echo "--- silentoldconfig 后，被翻回 =y 的项 ---"
          FLIPPED=""
          for sym in $KILL_SYMS; do
            if grep -q "^CONFIG_${sym}=y" .config; then
              FLIPPED="$FLIPPED $sym"
              echo "  $sym 被翻回 =y"
            fi
          done
          [ -z "$FLIPPED" ] && echo "  (无，前 2 道已解决全部)"

          # ---- 第 3 道：注释 Kconfig 中的 select 源（python 精确匹配） ----
          if [ -n "$FLIPPED" ]; then
            echo "===== 第 3 道：在 Kconfig 中注释 select 源 ====="
            for sym in $FLIPPED; do
              echo "--- 处理 $sym ---"
              python3 - "$sym" << 'PYEOF'
import sys, re, os, subprocess
sym = sys.argv[1]
try:
    out = subprocess.check_output(
        ['grep', '-rl', f'select {sym}', 'drivers/', 'arch/'],
        stderr=subprocess.DEVNULL, text=True
    ).strip().split('\n')
except subprocess.CalledProcessError:
    out = []
out = [f for f in out if f and os.path.isfile(f)]
if not out:
    print(f"  未找到显式 select {sym}（可能是 depends/default/imply 引起）")
else:
    pattern = re.compile(rf'^(\s*)select\s+{re.escape(sym)}\s*$')
    for kf in out:
        with open(kf) as f:
            lines = f.readlines()
        changed = False
        for i, ln in enumerate(lines):
            m = pattern.match(ln.rstrip('\n'))
            if m:
                lines[i] = f"{m.group(1)}# select {sym}  # disabled by NetHunter\n"
                changed = True
                print(f"  已注释 {kf}:{i+1}  select {sym}")
        if changed:
            with open(kf, 'w') as f:
                f.writelines(lines)
PYEOF
            done
          fi

          # ---- 第 4 道：olddefconfig 让 Kconfig 改动生效 ----
          echo "===== 第 4 道：make olddefconfig 让 Kconfig 改动生效 ====="
          make olddefconfig 2>&1 | tail -10 || true

          # ---- 第 5 道：最后再 sed 一次 .config ----
          echo "===== 第 5 道：sed .config 兜底 ====="
          for sym in $KILL_SYMS; do
            sed -i "s/^CONFIG_${sym}=y/# CONFIG_${sym} is not set/" .config
            sed -i "s/^CONFIG_${sym}=m/# CONFIG_${sym} is not set/" .config
          done

          # ---- 第 6 道：手工同步 auto.conf + touch，阻止 make 触发 silentoldconfig ----
          echo "===== 第 6 道：手工同步 auto.conf ====="
          mkdir -p include/config
          if [ -f include/config/auto.conf ]; then
            for sym in $KILL_SYMS; do
              sed -i "/^CONFIG_${sym}=/d" include/config/auto.conf
              sed -i "/^# CONFIG_${sym} is not set/d" include/config/auto.conf
            done
            for sym in $KILL_SYMS; do
              echo "# CONFIG_${sym} is not set" >> include/config/auto.conf
            done
            # 只让 auto.conf 比 .config 新，不要动 .config 的 mtime
            touch include/config/auto.conf
          else
            echo "警告：include/config/auto.conf 不存在，无法手工同步"
          fi

          echo "===== 编译前最终检查 ====="
          echo "--- .config ---"
          grep -E '^#? ?CONFIG_(USB_MSM_OTG|USB_MSM_HSPHY|USB_CI13XXX_MSM|QPNP_TYPEC|HUAWEI_TYPEC|DUAL_ROLE_USB_INTF|EXTCON|USB_G_ANDROID)' .config || echo "(无)"
          echo "--- auto.conf ---"
          grep -E '^#? ?CONFIG_(USB_MSM_OTG|USB_MSM_HSPHY|USB_CI13XXX_MSM|QPNP_TYPEC|HUAWEI_TYPEC|DUAL_ROLE_USB_INTF|EXTCON|USB_G_ANDROID)' include/config/auto.conf || echo "(无)"
          echo "--- 必须激活项 ---"
          grep -E '^CONFIG_USB_DWC3=|^CONFIG_USB_DWC3_DUAL_ROLE=|^CONFIG_USB_CONFIGFS=|^CONFIG_CONFIGFS_FS=|^CONFIG_USB_CONFIGFS_F_MTP=' .config

          # 硬校验（make 前）
          grep -q '^# CONFIG_USB_MSM_OTG is not set' .config || { echo "错误：USB_MSM_OTG 未被禁用"; exit 1; }
          grep -q '^# CONFIG_USB_CI13XXX_MSM is not set' .config || { echo "错误：USB_CI13XXX_MSM 未被禁用"; exit 1; }
          grep -q '^CONFIG_USB_DWC3_DUAL_ROLE=y' .config || { echo "错误：DWC3 Dual Role 丢失"; exit 1; }
          grep -q '^CONFIG_USB_CONFIGFS=y' .config || { echo "错误：CONFIGFS 丢失"; exit 1; }
          grep -q '^CONFIG_USB_CONFIGFS_F_MTP=y' .config || { echo "错误：F_MTP 丢失"; exit 1; }
          grep -q '^CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y' .config || { echo "错误：APPENDED_DTB 未启用"; exit 1; }
          echo "make 前硬校验通过"

          cp .config final_config.txt

          MEM_MB=$(($(grep MemTotal /proc/meminfo | awk '{print $2}')/1024))
          CPUS=$(nproc)
          MAX_JOBS=$((MEM_MB / 500))
          JOBS=$((MAX_JOBS < CPUS ? MAX_JOBS : CPUS))
          [ "$JOBS" -lt 1 ] && JOBS=1
          echo "使用并发: -j${JOBS} (CPU: ${CPUS}, 内存: ${MEM_MB}MB)"

          # ★★★ 编译
          make -j"${JOBS}" V=1 HOSTCFLAGS="-fcommon" Image.gz-dtb modules

          # ============================================================
          # ★★★ 编译后验证：auto.conf 是否被 silentoldconfig 改回
          # ============================================================
          echo "===== 编译后验证 ====="
          echo "--- .config 实际值 ---"
          grep -E '^#? ?CONFIG_(USB_MSM_OTG|USB_MSM_HSPHY|USB_CI13XXX_MSM|QPNP_TYPEC|HUAWEI_TYPEC|DUAL_ROLE_USB_INTF|EXTCON|USB_G_ANDROID)' .config || echo "(无)"
          echo "--- include/config/auto.conf（真正喂给编译器的）---"
          grep -E '^#? ?CONFIG_(USB_MSM_OTG|USB_MSM_HSPHY|USB_CI13XXX_MSM|QPNP_TYPEC|HUAWEI_TYPEC|DUAL_ROLE_USB_INTF|EXTCON|USB_G_ANDROID)' include/config/auto.conf || echo "(无)"
          echo "--- diff final_config.txt .config ---"
          if diff -q final_config.txt .config >/dev/null; then
            echo "一致：sed 改动未被翻回"
          else
            echo "警告：.config 在 make 期间被改动"
            diff final_config.txt .config | head -30 || true
          fi
          echo "--- 硬校验 auto.conf ---"
          if grep -q '^CONFIG_USB_MSM_OTG=y' include/config/auto.conf 2>/dev/null; then
            echo "错误：auto.conf 中 USB_MSM_OTG=y，编译实际启用了它"; exit 1
          fi
          if grep -q '^CONFIG_QPNP_TYPEC=y' include/config/auto.conf 2>/dev/null; then
            echo "警告：auto.conf 中 QPNP_TYPEC=y，说明还有别的 select 源"
          fi
          if grep -q '^CONFIG_EXTCON=y' include/config/auto.conf 2>/dev/null; then
            echo "警告：auto.conf 中 EXTCON=y，同上"
          fi
          echo "编译后验证完成"

          echo "===== 编译产物 ====="
          ls -la arch/arm64/boot/Image*
          [ -f arch/arm64/boot/Image.gz-dtb ] || { echo "错误：Image.gz-dtb 未生成"; exit 1; }

      - name: 上传最终内核配置
        uses: actions/upload-artifact@v4
        with:
          name: final-config
          path: final_config.txt

      - name: 收集模块
        run: |
          mkdir -p modules_output
          find . -path ./modules_output -prune -o -name '*.ko' -print -exec cp --parents {} modules_output/ \;
          KO_COUNT=$(find modules_output -type f -name '*.ko' | wc -l)
          if [ "$KO_COUNT" -eq 0 ]; then
            echo "错误：没有编译出模块"
            exit 1
          fi
          echo "共找到 ${KO_COUNT} 个模块"
          echo "===== WiFi 驱动模块 ====="
          find modules_output -type f -name '*.ko' | grep -iE "ath9k|rtl8|rtlwifi|rt2|rt2800|8188|8192" || echo "(未找到 WiFi 模块)"

      - name: 打包 AnyKernel3
        run: |
          for i in 1 2 3; do
            rm -rf anykernel || true
            git clone https://github.com/osm0sis/AnyKernel3 --depth=1 anykernel && break || sleep 5
          done

          if [ -f arch/arm64/boot/Image.gz-dtb ]; then
            cp -v arch/arm64/boot/Image.gz-dtb anykernel/
            echo "已使用 Image.gz-dtb"
          else
            echo "错误：未找到 Image.gz-dtb"
            ls -la arch/arm64/boot/
            exit 1
          fi

          mkdir -p anykernel/modules
          (cd modules_output && find . -type f -name '*.ko' -exec cp --parents {} ../anykernel/modules/ \;)
          cd anykernel

          sed -i 's/.*do\.devicecheck=.*/do.devicecheck=0/' anykernel.sh
          grep -q "^do.devicecheck=" anykernel.sh || echo "do.devicecheck=0" >> anykernel.sh

          sed -i 's/.*do\.dtb=.*/do.dtb=0/' anykernel.sh
          grep -q "^do.dtb=" anykernel.sh || echo "do.dtb=0" >> anykernel.sh

          sed -i 's/.*do\.modules=.*/do.modules=1/' anykernel.sh
          grep -q "^do.modules=" anykernel.sh || echo "do.modules=1" >> anykernel.sh

          sed -i 's/.*module_path=.*/module_path=\/system\/lib\/modules/' anykernel.sh
          grep -q "^module_path=" anykernel.sh || echo "module_path=/system/lib/modules" >> anykernel.sh

          echo "=== anykernel.sh 配置 ==="
          grep -n 'do\.devicecheck\|do\.dtb\|do\.modules\|module_path' anykernel.sh || true

          zip -r9 ../kernel-hwcan-nethunter.zip *
          cd ..

      - name: 上传完整刷机包
        uses: actions/upload-artifact@v4
        with:
          name: 完整刷机包-含内核和模块
          path: kernel-hwcan-nethunter.zip

      - name: 上传模块文件
        uses: actions/upload-artifact@v4
        with:
          name: 单独的模块文件-含目录结构
          path: modules_output/
