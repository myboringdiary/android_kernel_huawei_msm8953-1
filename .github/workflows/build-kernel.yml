name: 编译内核+打包模块
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
      options: --user root
    defaults:
      run:
        shell: bash -euxo pipefail {0}
    steps:
      - name: 安装编译依赖（含 Python 2、xz-utils）
        run: |
          apt-get update
          apt-get install -y git ccache automake flex lzop bison gperf build-essential \
            zip curl zlib1g-dev bc kmod cpio libssl-dev device-tree-compiler python2 xz-utils
          ln -sf /usr/bin/python2 /usr/bin/python

      - name: 检出代码
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: 拉取编译工具链（带重试并验证）
        run: |
          for i in 1 2 3; do
            rm -rf gcc gcc.tmp || true
            if git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
              -b android-8.1.0_r52 --depth=1 gcc.tmp; then
              mv gcc.tmp gcc
              break
            fi
            echo "第 ${i} 次克隆失败，等待 5 秒后重试..."
            sleep 5
          done

          if ! ls gcc/bin/aarch64-linux-android-gcc >/dev/null 2>&1; then
            echo "错误：交叉编译器不存在"
            ls -la gcc/bin || true
            exit 1
          fi
          echo "交叉编译器版本："
          gcc/bin/aarch64-linux-android-gcc --version || true

      - name: 修复缺失的 wireguard Kconfig 引用
        run: |
          if [ -f net/Kconfig ]; then
            sed -i 's|source "net/wireguard/Kconfig"|# source "net/wireguard/Kconfig"|' net/Kconfig
          else
            echo "警告：net/Kconfig 不存在，跳过"
          fi

      - name: 创建缺失的 rndis_ipa_trace.h 头文件
        run: |
          mkdir -p drivers/net/ethernet/msm
          printf '%s\n' \
          '/* SPDX-License-Identifier: GPL-2.0 */' \
          '#undef TRACE_SYSTEM' \
          '#define TRACE_SYSTEM rndis_ipa' \
          '' \
          '#if !defined(_TRACE_RNDIS_IPA_H) || defined(TRACE_HEADER_MULTI_READ)' \
          '#define _TRACE_RNDIS_IPA_H' \
          '' \
          '#include <linux/tracepoint.h>' \
          '' \
          'TRACE_EVENT(rndis_tx_dp,' \
          '    TP_PROTO(int proto),' \
          '    TP_ARGS(proto),' \
          '    TP_STRUCT__entry(' \
          '        __field(int, proto)' \
          '    ),' \
          '    TP_fast_assign(' \
          '        __entry->proto = proto;' \
          '    ),' \
          '    TP_printk("proto=%d", __entry->proto)' \
          ');' \
          '' \
          'TRACE_EVENT(rndis_status_rcvd,' \
          '    TP_PROTO(int proto),' \
          '    TP_ARGS(proto),' \
          '    TP_STRUCT__entry(' \
          '        __field(int, proto)' \
          '    ),' \
          '    TP_fast_assign(' \
          '        __entry->proto = proto;' \
          '    ),' \
          '    TP_printk("proto=%d", __entry->proto)' \
          ');' \
          '' \
          'TRACE_EVENT(rndis_netif_ni,' \
          '    TP_PROTO(int proto),' \
          '    TP_ARGS(proto),' \
          '    TP_STRUCT__entry(' \
          '        __field(int, proto)' \
          '    ),' \
          '    TP_fast_assign(' \
          '        __entry->proto = proto;' \
          '    ),' \
          '    TP_printk("proto=%d", __entry->proto)' \
          ');' \
          '' \
          '#endif /* _TRACE_RNDIS_IPA_H */' \
          '' \
          '#undef TRACE_INCLUDE_FILE' \
          '#define TRACE_INCLUDE_FILE rndis_ipa_trace' \
          '#undef TRACE_INCLUDE_PATH' \
          '#define TRACE_INCLUDE_PATH ../../drivers/net/ethernet/msm' \
          '#include <trace/define_trace.h>' \
          > drivers/net/ethernet/msm/rndis_ipa_trace.h

      - name: 批量修复所有 drivers 下 trace 头文件的 TRACE_INCLUDE_PATH
        run: |
          echo "开始扫描并修复 drivers/ 下所有 *_trace.h 的 TRACE_INCLUDE_PATH"
          find drivers -name "*_trace.h" -type f | while read -r file; do
            dir=$(dirname "$file")
            newpath="../../$dir"
            if grep -q '^#define TRACE_INCLUDE_PATH' "$file"; then
              sed -i "s|^#define TRACE_INCLUDE_PATH .*|#define TRACE_INCLUDE_PATH $newpath|" "$file"
              echo "已修复: $file -> $newpath"
            else
              echo "警告: $file 中没有 TRACE_INCLUDE_PATH 定义，跳过"
            fi
          done
          echo "批量修复完成"

      - name: 设置 swap 空间（改进检测与容错）
        run: |
          MEM_KB=$(grep MemTotal /proc/meminfo | awk '{print $2}')
          MEM_MB=$((MEM_KB/1024))
          echo "当前内存: ${MEM_MB} MB"
          if [ "$MEM_MB" -lt 12000 ]; then
            if command -v fallocate >/dev/null 2>&1 || command -v dd >/dev/null 2>&1; then
              fallocate -l 8G /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=8192
              chmod 600 /swapfile
              if command -v mkswap >/dev/null 2>&1; then mkswap /swapfile || true; fi
              if swapon /swapfile 2>/dev/null; then
                echo "已启用 8G swap"
              else
                echo "警告：swapon 不被允许或失败，继续但可能内存不足"
              fi
            else
              echo "警告：创建 swap 的工具不可用，跳过"
            fi
          else
            echo "内存充足，跳过 swap"
          fi

      - name: 编译内核和模块（含 dtbs，并彻底禁用冲突驱动）
        run: |
          export ARCH=arm64
          export PATH="$(pwd)/gcc/bin:$PATH"
          export CROSS_COMPILE="$(pwd)/gcc/bin/aarch64-linux-android-"
          make hwcan_defconfig

          # ---------- 强制禁用所有冲突配置（精确匹配，避免误伤 WLAN 框架） ----------
          echo "===== 开始禁用冲突配置（PRIMA/MSM_DBA/HUAWEI_FACTORY_INFO/PRISTON_WLAN）====="
          # 定义需要匹配的模式：仅 PRIMA 及其直接相关项，不包含通用 WLAN
          PATTERN='PRIMA|MSM_DBA|HUAWEI_FACTORY_INFO|PRISTON_WLAN'
          
          # 找出所有匹配的配置项，并记录
          CONFLICT_SYMS=$(grep -E "^CONFIG_.*(${PATTERN})" .config | cut -d'=' -f1 | sort -u)
          if [ -z "$CONFLICT_SYMS" ]; then
            echo "未找到任何匹配的冲突配置项，跳过。"
          else
            echo "找到以下冲突配置项："
            echo "$CONFLICT_SYMS"
            # 逐个禁用，先尝试 scripts/config，失败则用 sed 备用
            for sym in $CONFLICT_SYMS; do
              name="${sym#CONFIG_}"
              echo "---- 处理: $sym ----"
              if scripts/config --file .config --disable "$name" 2>/dev/null; then
                echo "已通过 scripts/config 禁用 $sym"
              else
                echo "scripts/config 禁用失败，尝试 sed 备用方案"
                # 移除可能存在的 =y 或 =m 行，替换为注释
                sed -i "s/^${sym}=.*/# ${sym} is not set/" .config
                echo "已通过 sed 处理 $sym"
              fi
            done
          fi

          # 重新生成有效配置
          echo "运行 make olddefconfig 以应用更改..."
          make olddefconfig

          # ---------- 再次检查残留 ----------
          echo "===== 残留检查（应无 =y 或 =m 项）====="
          RESIDUAL=$(grep -E "^CONFIG_.*(${PATTERN})" .config | grep -E '=(y|m)$' || true)
          if [ -n "$RESIDUAL" ]; then
            echo "错误：以下冲突配置仍被启用，必须修复！"
            echo "$RESIDUAL"
            exit 1
          else
            echo "通过：无任何冲突配置被启用"
          fi
          # ------------------------------------------------

          MEM_KB=$(grep MemTotal /proc/meminfo | awk '{print $2}')
          MEM_MB=$((MEM_KB/1024))
          CPUS=$(nproc)
          MAX_JOBS=$((MEM_MB / 500))
          JOBS=$((MAX_JOBS < CPUS ? MAX_JOBS : CPUS))
          JOBS=$((JOBS < 1 ? 1 : JOBS))
          echo "使用并发: -j${JOBS} (CPU: ${CPUS}, 内存: ${MEM_MB}MB)"
          make -j"${JOBS}" V=1 HOSTCFLAGS="-fcommon" Image.gz modules dtbs

      - name: 收集模块文件（保留目录结构，排除 modules_output）
        run: |
          mkdir -p modules_output
          find . -path ./modules_output -prune -o -name '*.ko' -print -exec cp --parents {} modules_output/ \;
          KO_COUNT=$(find modules_output -type f -name '*.ko' | wc -l)
          if [ "$KO_COUNT" -eq 0 ]; then
            echo "错误：没有编译出任何内核模块"
            exit 1
          fi
          echo "共找到 ${KO_COUNT} 个模块文件"
          echo "模块目录结构："
          find modules_output -type f -name '*.ko' | sed -n '1,100p'

      - name: 打包 AnyKernel3 刷机包
        run: |
          for i in 1 2 3; do
            rm -rf anykernel || true
            git clone https://github.com/osm0sis/AnyKernel3 --depth=1 anykernel && break || sleep 5
          done

          if [ -f arch/arm64/boot/Image.gz ]; then
            cp -v arch/arm64/boot/Image.gz anykernel/
          elif [ -f arch/arm64/boot/Image ]; then
            gzip -c arch/arm64/boot/Image > anykernel/Image.gz
            echo "已将 Image 压缩为 Image.gz"
          else
            echo "错误：找不到内核镜像文件"
            exit 1
          fi

          echo "=== 所有生成的 dtb 文件 ==="
          find arch/arm64/boot/dts -type f -name "*.dtb" | sed -n '1,200p'

          DTB_FILE=$(find arch/arm64/boot/dts -type f -iname "*can-l02*.dtb" -print -quit)
          if [ -n "$DTB_FILE" ]; then
            mkdir -p anykernel/dtb
            cp -v "$DTB_FILE" anykernel/dtb/
            echo "使用 DTB: $DTB_FILE"
          else
            echo "错误：找不到 can-l02 对应的 dtb 文件"
            echo "可用 dtb 列表："
            find arch/arm64/boot/dts -type f -name "*.dtb" | sed -n '1,200p'
            exit 1
          fi

          mkdir -p anykernel/modules
          (cd modules_output && find . -type f -name '*.ko' -exec cp --parents {} ../anykernel/modules/ \;)
          cd anykernel

          sed -i 's/.*do\.devicecheck=.*/do.devicecheck=0/' anykernel.sh
          grep -q "^do.devicecheck=" anykernel.sh || echo "do.devicecheck=0" >> anykernel.sh

          sed -i 's/.*do\.dtb=.*/do.dtb=1/' anykernel.sh
          grep -q "^do.dtb=" anykernel.sh || echo "do.dtb=1" >> anykernel.sh

          sed -i 's/.*do\.modules=.*/do.modules=1/' anykernel.sh
          grep -q "^do.modules=" anykernel.sh || echo "do.modules=1" >> anykernel.sh

          sed -i 's/.*module_path=.*/module_path=\/system\/lib\/modules/' anykernel.sh
          grep -q "^module_path=" anykernel.sh || echo "module_path=/system/lib/modules" >> anykernel.sh

          echo "=== anykernel.sh 关键配置检查 ==="
          grep -n 'do\.devicecheck\|do\.dtb\|do\.modules\|module_path' anykernel.sh || true

          zip -r9 ../kernel-hwcan-nethunter.zip *
          cd ..

      - name: 上传完整刷机包
        uses: actions/upload-artifact@v4
        with:
          name: 完整刷机包-含内核和模块
          path: kernel-hwcan-nethunter.zip

      - name: 上传模块文件（单独备份，保留目录结构）
        uses: actions/upload-artifact@v4
        with:
          name: 单独的模块文件-含目录结构
          path: modules_output/
